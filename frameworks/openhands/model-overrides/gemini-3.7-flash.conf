# Gemini 3.7 Flash, as OpenHands must dial it. Overrides models/gemini-3.7-flash.conf
# for this framework only. See ./README.md for why this is not a key in that file.
#
# THE PROBLEM THIS SOLVES, in one line: under OpenHands the LLM call is made from
# INSIDE the container, and Vertex AI authenticates with Application Default
# Credentials, which are a file on the host.
#
# Measured 9 Sep 2026. The agent-server is started as
#   docker run -d --platform linux/amd64 --rm ... -e LMNR_SPAN_CONTEXT=null -p 32323:8000
# -- one environment variable, no credential, no mount. The LLM call then happens in
# that container: the traceback of the failed run is in
# `/agent-server/.venv/lib/python3.13/.../vertex_llm_base.py`, the container's
# filesystem, while the host process only polls `remote_conversation.py`. So
# `google.auth.default()` runs where ~/.config/gcloud does not exist and raises
# `DefaultCredentialsError`.
#
# An API key survives this and ADC does not, for a reason worth stating: `api_key` is a
# field on the SDK's `LLM` object, so it is serialised over HTTP into the agent-server.
# ADC is a path on a filesystem the container does not share. Every OpenRouter model
# works for exactly that reason. mini-swe-agent is unaffected throughout -- it runs the
# model host-side, where the ADC is -- which is why this override is scoped here and
# `models/gemini-3.7-flash.conf` still says `vertex_ai/...`.
#
# WHY NOT PUT A CREDENTIAL IN THE CONTAINER. Two ways were available and both were
# rejected:
#   - Forwarding the credential as an environment variable. `DockerWorkspace.forward_env`
#     would do it, and litellm reads a service-account JSON from `VERTEXAI_CREDENTIALS`
#     (verified: it authenticated). But the agent under study executes shell commands in
#     that same container and inherits that environment -- `env` prints the private key
#     in full, verified against a real SWE-bench image -- and `trajectory.json`, which
#     records the agent's commands and their output, is tracked in git (1,114 files).
#     The SDK's own `redact_text_secrets` does not redact `docker run -e NAME=value`
#     flags; that was tested, not assumed.
#   - A scoped service account, which would have bounded the damage to "can spend the
#     Vertex budget". Blocked: `gen-lang-client-0243117553` is owned by another account
#     and ours holds `roles/editor`, which deliberately excludes
#     `resourcemanager.projects.setIamPolicy`. A service account we cannot grant a role
#     to is useless, and the key that exists (`ais-gemini-key-...`, made by AI Studio)
#     holds no roles on the project: it returns 403 IAM_PERMISSION_DENIED.
#
# So the credential stays on the host and the container is given a URL instead. Nothing
# the agent can read is worth stealing.

# What litellm dials INSIDE the container: an OpenAI-compatible endpoint, not a provider.
# It CANNOT stay `vertex_ai/...`: litellm resolves a Google OAuth token in
# `_ensure_access_token` BEFORE it ever looks at `api_base`, so a Vertex model id with a
# base_url still fails on credentials it will never need.
LITELLM_ID="openai/gemini-3.7-flash"

# The proxy, on the host, holding the ADC. `host.docker.internal` is how the container
# reaches it (verified to resolve to 192.168.65.254 from inside a SWE-bench image).
# It must NOT be 127.0.0.1: that is the container's own loopback.
BASE_URL="http://host.docker.internal:4000"

# The proxy's own key, not a provider key. The proxy binds 0.0.0.0 because a container
# cannot reach the host's loopback, so it is reachable from the LAN and authenticates.
API_KEY_ENV="OPENHANDS_PROXY_KEY"

# PROVENANCE ONLY -- never dialled, never a label. `models/gemini-3.7-flash.conf` keeps
# the ACTUAL route per run "so provenance is auditable without fragmenting the
# aggregate", and routing through a proxy would have quietly cost that: the recorded
# route would read `openai/gemini-3.7-flash`, which does not say Vertex. This says it.
UPSTREAM_ROUTE="vertex_ai/gemini-3.7-flash"
