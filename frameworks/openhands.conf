# OpenHands V1, the second agent framework. See frameworks/README.md.
#
# A function-calling agent with a real tool set: `terminal`, `file_editor`, `grep`,
# `glob`, `apply_patch`, and -- the reason this framework is here -- a `browser_*`
# toolset. Under mini-swe-agent, fetching a URL is something the model must think to do
# with a shell command; here it is a tool it is offered. That difference is what
# separates "agents do not seek out guidelines" from "that scaffold made looking
# expensive", which 300 naive runs could not tell apart.
#
# NOTE ON WHAT "OpenHands" MEANS NOW. The monolithic python repository the design notes
# describe no longer exists at HEAD: All-Hands-AI/OpenHands became OpenHands/OpenHands and
# is now Agent Canvas, a TypeScript UI. The agent moved to two repositories, and V1 is
# what this experiment targets.
#
# Pinned by sha, not by branch. V1 is under active development -- the SDK was pushed the
# same week this was written -- and the adapter is written against one event schema. A
# sweep that spans weeks must not have its framework change underneath it.
#
#   benchmarks  f60e4ed11262b667896ce9f554dd487057fd1ef2   (2026-08-17)
#   sdk         43376f1868ffd702746080714a59c16d3f69ec12   (vendored submodule pin)
#
# The sdk sha is NOT chosen by us: `benchmarks` vendors it at
# `vendor/software-agent-sdk`, so the pair is upstream's own statement of what is
# compatible. Re-pin by moving `benchmarks` and taking whatever submodule it names.

DISPLAY_NAME="OpenHands"

ADAPTER="compliance.adapters.openhands"

SOURCE="https://github.com/OpenHands/benchmarks"
SOURCE_SDK="https://github.com/OpenHands/software-agent-sdk"

PIN_BENCHMARKS="f60e4ed11262b667896ce9f554dd487057fd1ef2"
PIN_SDK="43376f1868ffd702746080714a59c16d3f69ec12"
