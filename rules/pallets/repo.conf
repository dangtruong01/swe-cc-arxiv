# Per-repo configuration for the compliance experiment. See rules/sympy/repo.conf for
# what each key is for; the format is deliberately identical, and both are read by
# scripts/run_test.sh (shell) and rules/build_contributing_rules.py (python).

DISPLAY_NAME="Flask"

# flask's own docs page at https://flask.palletsprojects.com/en/stable/contributing/
