# which is where every rule in this corpus except the pull request template comes from.
DOCS_URL="https://palletsprojects.com/contributing/"

# Derived from the Part 2/Part 3 extraction in pallets-extraction-frozen.csv. The
# workbook IS the corpus -- never edit an exported CSV by hand.
CORPUS="pallets-rules.xlsx"

REPO_URL="https://github.com/pallets/flask.git"
