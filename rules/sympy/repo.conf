# Per-repo configuration for the compliance experiment.
#
# Everything repo-specific in the harness lives in a file like this one. Adding a
# repository is: create rules/<slug>/repo.conf + its rule corpus, and nothing in
# the harness or the checker changes. <slug> is the SWE-bench instance prefix, so
# sympy__sympy-11618 -> rules/sympy/, django__django-11099 -> rules/django/.
#
# Sourced by scripts/run_test.sh (shell) and parsed by rules/build_contributing_rules.py
# (python), so keep it to plain KEY="value" lines with no substitutions.

# Human-readable name, used in the generated guided-condition rules file.
DISPLAY_NAME="SymPy"

# Contribution guidelines index, pasted into the prompt in the `naive` condition and
# probed for reachability at container startup. A naive run whose agent cannot reach
# this URL is void, not a low score.
DOCS_URL="https://docs.sympy.org/dev/contributing/index.html"

# Rule corpus to build the guided-condition file from, relative to this directory.
CORPUS="sympy-rules.xlsx"

# Upstream repository, cloned blobless into .cache/repos/<slug> so the checker can
# reconstruct post-patch file contents from base_commit + patch. Read-only; never
# pushed to, never checked out.
REPO_URL="https://github.com/sympy/sympy.git"
