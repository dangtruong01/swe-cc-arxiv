# Per-repo configuration for the compliance experiment. See rules/sympy/repo.conf for
# what each key is for; the format is deliberately identical, and both are read by
# scripts/run_test.sh (shell) and rules/build_contributing_rules.py (python).

DISPLAY_NAME="Seaborn"

# seaborn publishes no contributing or development documentation on its website:
# https://seaborn.pydata.org/ (seaborn 0.13.2) has no such page in its navigation. Every
# contribution rule lives in repository files, so the pinned root is the repo tree at the
# commit the corpus was extracted from -- 0.14.0.dev0. From this page GitHub renders
# README.md (the Testing section, four of the five rules) and links .github/CONTRIBUTING.md
# (the fifth). Never /stable/.
DOCS_URL="https://github.com/mwaskom/seaborn/tree/f04b6cd5484267a0885d1fed068e99dff3a1b226"

# Derived from the Part 2/Part 3 extraction in mwaskom-extraction-frozen.csv. The
# workbook IS the corpus -- never edit an exported CSV by hand.
CORPUS="mwaskom-rules.xlsx"

REPO_URL="https://github.com/mwaskom/seaborn.git"
