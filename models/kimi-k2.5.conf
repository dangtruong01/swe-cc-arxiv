# Kimi K2.5. See models/README.md for the contract.
#
# KEPT DELIBERATELY despite reading the mounted guidelines in only 2 of 6 runs, and both
# times late (step 43 of 57, step 61 of 81).
# Selecting models on whether they read the
# guidelines would select on a variable adjacent to the outcome and inflate every
# compliance figure. The 33% is reported, not designed away. MiniMax M2.5 was evaluated as
# a replacement and is worse (0/2) despite ranking higher on SWE-bench.
#
# Run at HIGH reasoning effort by explicit choice. It is the only model in the design
# with a non-default reasoning setting -- see the note in models/README.md, because that
# makes its results not purely a statement about the model. Measured: effort is NOT the
# cause of the low retrieval rate -- a control at reasoning=default did not read the file
# either -- so the setting costs nothing in interpretability here.
#
# Verified against OpenRouter's live catalogue on 26 Aug 2026: the id resolves, the model
# answers, and the prices below are what the catalogue reported.

DISPLAY_NAME="Kimi K2.5"

LITELLM_ID="openrouter/moonshotai/kimi-k2.5"

# $/Mtok. Input is >99% of this experiment's bill, so PRICE_IN is the figure the cost
# model scales; PRICE_OUT is recorded for completeness.
PRICE_IN="0.60"
PRICE_OUT="3.00"

# Reasoning effort, passed through to the provider. Only set where chosen deliberately.
REASONING_EFFORT="high"

VENDOR="moonshotai"
WEIGHTS="open"
CONTEXT="262144"
