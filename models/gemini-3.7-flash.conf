# Gemini 3.7 Flash. See models/README.md for the contract.
#
# Newest Gemini flash and the cheapest -- the flash line is NOT monotonic in price
# (3.5-flash is $1.50, four times this).
#
# Verified against OpenRouter's live catalogue on 26 Aug 2026: the id resolves, the model
# answers, and the prices below are what the catalogue reported.

DISPLAY_NAME="Gemini 3.7 Flash"

# ROUTING id -- what litellm dials. Moved off OpenRouter to the direct Google API on
# 4 Sep 2026: the OpenRouter key has a hard spending cap that this model was exhausting
# (it is 27x gpt-5.6-luna per cell and produced 64% of one day's spend), while the Gemini
# key carries its own, larger budget.
LITELLM_ID="vertex_ai/gemini-3.7-flash"

# Vertex AI, not AI Studio, as of 8 Sep 2026. Three reasons, in order of force:
#
#   1. The AI Studio key is bound to a GCP project where
#      `generativelanguage.googleapis.com` is BLOCKED -- the call returns
#      `PERMISSION_DENIED / API_KEY_SERVICE_BLOCKED`. Enabling the Agent Platform API on
#      that project does not enable the Generative Language API; they are separate services.
#   2. Vertex bills to a GCP project, so it spends GCP credits rather than AI Studio
#      billing -- which is where this project's remaining budget actually sits.
#   3. AI Studio had already hit a daily request quota (5 Sep) and a monthly spending cap
#      (7 Sep). Both stopped the sweep dead.
#
# LOCATION IS `global`, NOT a region. `us-central1` returns
# `404 Publisher model ... was not found`; only `global` resolves this model.
#
# Auth is Application Default Credentials (`gcloud auth application-default login`), not
# an API key, so no key goes in .env for this model.
VERTEXAI_PROJECT="gen-lang-client-0243117553"
VERTEXAI_LOCATION="global"

# REPORTING id -- what the corpus is keyed on. Deliberately UNCHANGED by the reroute.
#
# `compliance report` groups by the litellm id recorded in each row, not by the run
# directory slug. 828 gemini runs already carry `openrouter/google/gemini-3.7-flash`
# (150 sympy/mini-swe-agent, 132 sympy/openhands, 462 django/mini-swe-agent,
# 84 django/openhands). Letting the routing change reach the label would split those from
# every future run and make one model report as two -- the `!! POOLING 2 CELLS` shape,
# a key that is not unique, losing data quietly.
#
# The provider is a delivery detail; the weights are the same model. So routing and
# reporting are separated here, and the ACTUAL route is still recorded per run as
# `llm_route` in the probe, so provenance is auditable without fragmenting the aggregate.
CANONICAL_ID="openrouter/google/gemini-3.7-flash"

# Which environment variable holds this model's key. Absent => OPENROUTER_API_KEY.
API_KEY_ENV="GEMINI_API_KEY"

# $/Mtok. Input is >99% of this experiment's bill, so PRICE_IN is the figure the cost
# model scales; PRICE_OUT is recorded for completeness.
PRICE_IN="0.38"
PRICE_OUT="1.88"

VENDOR="google"
WEIGHTS="closed"
CONTEXT="1048576"
